[project]
name = "pyreach"
version = "0.1.0"
description = "Static reachability analysis for Python dependency vulnerabilities"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Julio Centeno" },
    { name = "Jose Alonso Yanez" },
]
requires-python = ">=3.10"
keywords = ["security", "sca", "reachability", "sarif", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "networkx>=3.4.2",
    "jsonschema>=4.0",
    "packaging>=23.0",
    "pyyaml>=6.0",
]

[project.scripts]
pyreach = "pyreach.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "factory-boy>=3.3",
    "freezegun>=1.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyreach"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".venv",
  ".git",
  ".opencode",
  ".agents",
  "graphify-out",
  "dist",
  "context",
  "__pycache__",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "performance: long-running performance tests (deselect with '-m \"not performance\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".agents",
    ".opencode",
    "documentation/pyreach-benchmark-plan",
    "tests/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
exclude = [
    "tests/fixtures",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["pyreach"]
patch = ["subprocess"]

[tool.ruff.format]
exclude = ["*.md"]
