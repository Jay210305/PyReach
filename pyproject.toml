[project]
name = "pyreach"
version = "0.1.0"
description = "Static reachability analysis for Python dependency vulnerabilities"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Julio Centeno" },
    { name = "Jose Alonso Yanez" },
]
requires-python = ">=3.10"
keywords = ["security", "sca", "reachability", "sarif", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "networkx>=3.0",
    "jsonschema>=4.0",
    "packaging>=23.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "factory-boy>=3.3",
    "freezegun>=1.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

# The PyReach package is not implemented yet; flip to `package = true`
# (and add a [build-system]) once the `pyreach/` package exists.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "performance: long-running performance tests (deselect with '-m \"not performance\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
