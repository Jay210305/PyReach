name: Quality and offline delivery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: uv run ruff check pyreach tests scripts/validate_release.py
      - run: uv run ruff format --check pyreach tests scripts/validate_release.py
      - run: uv run mypy pyreach
      - run: uv run pytest -m 'not performance' --cov=pyreach --cov-report=xml --junitxml=junit.xml --cov-fail-under=80
      - run: uv run bandit -r pyreach -ll
      - run: uv run python scripts/validate_release.py --output release-evidence
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
            release-evidence/
            dist/
